[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-pre2"
version = "0.1.0"
description = "RTX4090 P-only trace to RTX3090/GB10 operator CTX and single-forward GI prediction"
requires-python = ">=3.10"
dependencies = ["torch>=2.7"]

[tool.setuptools.packages.find]
where = ["src"]
