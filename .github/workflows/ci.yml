name: CPU contracts and I4 model checks

on:
  push:
    branches:
      - main
      - integration/**
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --no-deps
      - name: Compile Python code
        run: python -m compileall -q src scripts tests e2_calibration
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: I3 catalog
        run: python scripts/audit_i3_catalog.py
      - name: End-to-end synthetic mixed training smoke
        run: |
          python scripts/train_i4.py --train examples/i4/train.synthetic.jsonl --validation examples/i4/validation.synthetic.jsonl --mode pretrain_mixed --pretrain-updates 2 --second-updates 2 --log-every 1 --out /tmp/gpu_pre2_synthetic_i4
          test -f /tmp/gpu_pre2_synthetic_i4/recognizer.pt
          test -f /tmp/gpu_pre2_synthetic_i4/normalizer.json
          test -f /tmp/gpu_pre2_synthetic_i4/report.json
